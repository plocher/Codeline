<svg xmlns="http://www.w3.org/2000/svg" width="820" height="414" viewBox="0 0 820 414" font-family="Helvetica, Arial, sans-serif">
  <title>Below the Smart Appliance Interface: Smart Appliances and Hardware Drivers</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <style>
      .bg   { fill:#ffffff; }
      .grp  { fill:#e9eef5; stroke:#555555; stroke-width:2; }
      .gt   { fill:#333333; font-size:15.5px; font-weight:bold; }
      .gsub { fill:#555555; font-size:13px; font-weight:normal; }
      .box  { fill:#ffffff; stroke:#333333; stroke-width:1.5; }
      .smart{ fill:#eef6ec; stroke:#4f7d45; stroke-width:2; }
      .seam { fill:#fff3cc; stroke:#8a6d00; stroke-width:2; }
      .io   { fill:#f3e2bc; stroke:#8a6d00; stroke-width:1.6; }
      .iot  { fill:#5c4600; font-size:11px; font-weight:bold; }
      .tb   { fill:#333333; font-size:14px; font-weight:bold; }
      .ts   { fill:#555555; font-size:12px; }
      .st   { fill:#333333; font-size:14.5px; font-weight:bold; }
      .ss   { fill:#555555; font-size:12px; }
      .ln   { stroke:#333333; stroke-width:2; fill:none; marker-start:url(#a); marker-end:url(#a); }
      .h1   { fill:#333333; font-size:21px; font-weight:bold; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="414"/>

  <text class="h1" x="30" y="34">Below the Smart Appliance Interface</text>
  <text class="ts" x="30" y="54">One shared Reference Appliance Core plugs into Simulated, Direct, or Proxy drivers; hardware stays behind HW I/O</text>

  <!-- SMART APPLIANCE INTERFACE HEADER -->
  <polygon class="seam" points="48,72 772,72 788,98 772,124 48,124 32,98"/>
  <text class="st" x="410" y="93" text-anchor="middle">SMART APPLIANCE INTERFACE — Typed Async Logical API (local C++ or MQTT)</text>
  <text class="ss" x="410" y="113" text-anchor="middle">TURNOUT  •  SENSOR  •  SIGNALMAST  •  TRAINORDER  •  CROSSING  •  CONTROL  •  LAMP</text>

  <!-- 3. SMART APPLIANCES -->
  <rect class="grp" x="30" y="148" width="760" height="118" rx="10"/>
  <text class="gt" x="48" y="173">3. SMART APPLIANCES<tspan class="gsub"> — Shared Reference Core &amp; Pluggable Drivers</tspan></text>
  <line class="ln" x1="162" y1="126" x2="162" y2="146"/>
  <line class="ln" x1="410" y1="126" x2="410" y2="146"/>
  <line class="ln" x1="658" y1="126" x2="658" y2="146"/>

  <rect class="smart" x="48" y="186" width="228" height="62" rx="6"/>
  <text class="tb" x="162" y="213" text-anchor="middle">Simulated</text>
  <text class="ts" x="162" y="232" text-anchor="middle">SimulatedDriver (sim &amp; tests)</text>

  <rect class="box" x="296" y="186" width="228" height="62" rx="6"/>
  <text class="tb" x="410" y="207" text-anchor="middle">Direct</text>
  <text class="ts" x="410" y="224" text-anchor="middle">DirectHardwareDriver + pin bind</text>
  <rect class="io" x="376" y="238" width="68" height="20" rx="4"/>
  <text class="iot" x="410" y="252" text-anchor="middle">HW I/O</text>

  <rect class="box" x="544" y="186" width="228" height="62" rx="6"/>
  <text class="tb" x="658" y="207" text-anchor="middle">Proxy</text>
  <text class="ts" x="658" y="224" text-anchor="middle">ProxyBusDriver (legacy buses)</text>
  <rect class="io" x="624" y="238" width="68" height="20" rx="4"/>
  <text class="iot" x="658" y="252" text-anchor="middle">HW I/O</text>

  <!-- No hardware note under Simulated -->
  <text class="ts" x="162" y="328" text-anchor="middle" font-style="italic">Pure software —</text>
  <text class="ts" x="162" y="345" text-anchor="middle" font-style="italic">zero physical hardware</text>

  <!-- HARDWARE I/O & BUS DRIVERS -->
  <rect class="grp" x="278" y="290" width="512" height="106" rx="10"/>

  <line class="ln" x1="410" y1="260" x2="410" y2="304"/>
  <line class="ln" x1="658" y1="260" x2="658" y2="304"/>

  <rect class="box" x="296" y="306" width="228" height="54" rx="6"/>
  <text class="tb" x="410" y="329" text-anchor="middle">Discrete Board I/O</text>
  <text class="ts" x="410" y="347" text-anchor="middle">cpNode-IOX • Pixels • Servos • GPIO</text>

  <rect class="box" x="544" y="306" width="228" height="54" rx="6"/>
  <text class="tb" x="658" y="329" text-anchor="middle">Layout Bus Drivers</text>
  <text class="ts" x="658" y="347" text-anchor="middle">C/MRI • LocoNet • LCC • JMRI</text>

  <text class="gt" x="534" y="384" text-anchor="middle">HARDWARE I/O &amp; BUS DRIVERS<tspan class="gsub"> — Implementation Detail</tspan></text>
</svg>
