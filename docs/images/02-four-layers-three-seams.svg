<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" font-family="Helvetica, Arial, sans-serif">
  <title>Codeline Architecture: From Dispatcher Office to Layout Wiring</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
    <style>
      .bg   { fill:#ffffff; }
      .grp  { fill:#e9eef5; stroke:#555555; stroke-width:2; }
      .gt   { fill:#333333; font-size:17px; font-weight:bold; }
      .box  { fill:#ffffff; stroke:#333333; stroke-width:1.5; }
      .safe { fill:#fde8e8; stroke:#b00000; stroke-width:2.5; }
      .smart{ fill:#eef6ec; stroke:#4f7d45; stroke-width:2; }
      .t    { fill:#333333; font-size:14px; }
      .tb   { fill:#333333; font-size:14px; font-weight:bold; }
      .ts   { fill:#555555; font-size:13px; }
      .seam { fill:#fff3cc; stroke:#8a6d00; stroke-width:2; }
      .st   { fill:#333333; font-size:15px; font-weight:bold; }
      .ss   { fill:#555555; font-size:13px; }
      .cat  { fill:#dde6f0; stroke:#1f5fbf; stroke-width:1.5; }
      .ln   { stroke:#333333; stroke-width:2; fill:none; marker-start:url(#a); marker-end:url(#a); }
      .dl   { stroke:#1f5fbf; stroke-width:2; fill:none; stroke-dasharray:7 5; marker-end:url(#b); }
      .h1   { fill:#333333; font-size:22px; font-weight:bold; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="900"/>

  <text class="h1" x="30" y="36">Codeline Architecture — Hardware-Agnostic Logic Over Smart Appliances</text>
  <text class="ts" x="30" y="58">Above the Smart Appliance Interface, Codeline is 100% hardware-agnostic; below it, adapters expose any bus or pin as a Smart Appliance</text>

  <!-- DISPATCHER OFFICE -->
  <rect class="grp" x="30" y="76" width="700" height="126" rx="10"/>
  <text class="gt" x="50" y="104">1. DISPATCHER OFFICE — Remote Operator Intent (Non-Vital)</text>

  <rect class="box" x="50" y="118" width="206" height="66" rx="6"/>
  <text class="tb" x="153" y="142" text-anchor="middle">Physical CTC Machine</text>
  <text class="ts" x="153" y="164" text-anchor="middle">US&amp;S / GRS levers &amp; lamps</text>

  <rect class="box" x="277" y="118" width="206" height="66" rx="6"/>
  <text class="tb" x="380" y="142" text-anchor="middle">Screen Dispatcher Panel</text>
  <text class="ts" x="380" y="164" text-anchor="middle">Codeline software console</text>

  <rect class="box" x="504" y="118" width="206" height="66" rx="6"/>
  <text class="tb" x="607" y="142" text-anchor="middle">Automated Dispatcher</text>
  <text class="ts" x="607" y="164" text-anchor="middle">Test runner or display replay</text>

  <!-- CODE LINE INTERFACE -->
  <polygon class="seam" points="50,222 710,222 726,252 710,282 50,282 34,252"/>
  <text class="st" x="380" y="246" text-anchor="middle">CODE LINE INTERFACE (Office ↔ Field)</text>
  <text class="ss" x="380" y="268" text-anchor="middle">Controls ▼  /  Indications ▲</text>
  <line class="ln" x1="380" y1="202" x2="380" y2="220"/>

  <!-- VITAL FIELD LOGIC -->
  <rect class="grp" x="30" y="302" width="700" height="164" rx="10"/>
  <text class="gt" x="50" y="330">2. VITAL FIELD LOGIC — Hardware-Agnostic AREMA Solver</text>
  <line class="ln" x1="380" y1="284" x2="380" y2="300"/>

  <rect class="safe" x="50" y="344" width="206" height="102" rx="6"/>
  <text class="tb" x="153" y="372" text-anchor="middle">Vital Locking Engine</text>
  <text class="ts" x="153" y="394" text-anchor="middle">Enforces detector, route,</text>
  <text class="ts" x="153" y="414" text-anchor="middle">approach &amp; electric locks</text>

  <rect class="safe" x="277" y="344" width="206" height="102" rx="6"/>
  <text class="tb" x="380" y="372" text-anchor="middle">Route &amp; Mast Solver</text>
  <text class="ts" x="380" y="394" text-anchor="middle">Evaluates route equations</text>
  <text class="ts" x="380" y="414" text-anchor="middle">for each mast's valid set</text>

  <rect class="safe" x="504" y="344" width="206" height="102" rx="6"/>
  <text class="tb" x="607" y="372" text-anchor="middle">Block &amp; Traffic Logic</text>
  <text class="ts" x="607" y="394" text-anchor="middle">Coordinates H/D &amp; APB</text>
  <text class="ts" x="607" y="414" text-anchor="middle">between control points</text>

  <!-- SMART APPLIANCE INTERFACE (UNIVERSAL FLOOR) -->
  <polygon class="seam" points="50,486 710,486 726,516 710,546 50,546 34,516"/>
  <text class="st" x="380" y="510" text-anchor="middle">SMART APPLIANCE INTERFACE — The Universal Hardware-Agnostic Floor</text>
  <text class="ss" x="380" y="532" text-anchor="middle">Every Mast, Switch, Detector, Lock &amp; Fascia Control is a Smart Appliance</text>
  <line class="ln" x1="380" y1="466" x2="380" y2="484"/>

  <!-- SMART APPLIANCE IMPLEMENTATION -->
  <rect class="grp" x="30" y="566" width="700" height="120" rx="10"/>
  <text class="gt" x="50" y="594">3. SMART APPLIANCE IMPLEMENTATION — Direct, Simulated &amp; Proxy Units</text>
  <line class="ln" x1="153" y1="548" x2="153" y2="564"/>
  <line class="ln" x1="380" y1="548" x2="380" y2="564"/>
  <line class="ln" x1="607" y1="548" x2="607" y2="564"/>

  <rect class="smart" x="50" y="608" width="206" height="62" rx="6"/>
  <text class="tb" x="153" y="632" text-anchor="middle">Simulated Appliances</text>
  <text class="ts" x="153" y="654" text-anchor="middle">Built-in virtual trains &amp; plant</text>

  <rect class="box" x="277" y="608" width="206" height="62" rx="6"/>
  <text class="tb" x="380" y="632" text-anchor="middle">Direct Smart Appliances</text>
  <text class="ts" x="380" y="654" text-anchor="middle">Device profiles + pin routing</text>

  <rect class="box" x="504" y="608" width="206" height="62" rx="6"/>
  <text class="tb" x="607" y="632" text-anchor="middle">Proxy Appliances</text>
  <text class="ts" x="607" y="654" text-anchor="middle">Wraps C/MRI, LocoNet &amp; LCC</text>

  <!-- DRIVER / HARDWARE I/O INTERFACE -->
  <polygon class="seam" points="284,704 704,704 716,730 704,756 284,756 272,730"/>
  <text class="st" x="494" y="735" text-anchor="middle">HARDWARE I/O &amp; BUS DRIVER INTERFACE</text>
  <line class="ln" x1="380" y1="686" x2="380" y2="702"/>
  <line class="ln" x1="607" y1="686" x2="607" y2="702"/>

  <!-- LAYOUT BUSES & WIRING -->
  <rect class="grp" x="30" y="774" width="700" height="106" rx="10"/>
  <text class="gt" x="50" y="802">4. LAYOUT BUSES &amp; BENCHWORK WIRING (Exposes Hardware as Appliances)</text>
  <line class="ln" x1="494" y1="758" x2="494" y2="772"/>

  <rect class="box" x="50" y="814" width="320" height="52" rx="6"/>
  <text class="tb" x="210" y="836" text-anchor="middle">Distributed Buses (C/MRI, LocoNet, LCC)</text>
  <text class="ts" x="210" y="854" text-anchor="middle">Direct bus hosts, JMRI profile import &amp; Deak nodes</text>

  <rect class="box" x="390" y="814" width="320" height="52" rx="6"/>
  <text class="tb" x="550" y="836" text-anchor="middle">Discrete Board I/O (cpNode-IOX, Pixels, GPIO)</text>
  <text class="ts" x="550" y="854" text-anchor="middle">I2C expanders, NeoPixels, Servos &amp; Active-Low pins</text>

  <!-- RIGHT COLUMN: WHERE DOES THE LOGIC RUN? -->
  <rect class="grp" x="766" y="210" width="324" height="560" rx="10" style="stroke:#1f5fbf"/>
  <text class="gt" x="786" y="240">FLEXIBLE DEPLOYMENT</text>
  <text class="ts" x="786" y="262">Choose where Vital Logic runs</text>

  <rect class="cat" x="786" y="284" width="284" height="110" rx="6"/>
  <text class="tb" x="928" y="308" text-anchor="middle">Option A: Office Brain + Gateways</text>
  <text class="ts" x="928" y="330" text-anchor="middle">• Office runs Dispatcher + Vital Logic</text>
  <text class="ts" x="928" y="350" text-anchor="middle">• Field nodes are stateless Smart</text>
  <text class="ts" x="928" y="368" text-anchor="middle">Appliance Gateways (C/MRI, I2C, Wi-Fi)</text>
  <text class="ts" x="928" y="386" text-anchor="middle">• Zero field re-flash on rule changes</text>

  <rect class="cat" x="786" y="408" width="284" height="106" rx="6"/>
  <text class="tb" x="928" y="432" text-anchor="middle">Option B: Autonomous Bungalows</text>
  <text class="ts" x="928" y="454" text-anchor="middle">• Bungalow ESP32 runs Vital Logic +</text>
  <text class="ts" x="928" y="472" text-anchor="middle">local cpNode-IOX / Pixel / Servo I/O</text>
  <text class="ts" x="928" y="492" text-anchor="middle">• Runs signals &amp; locks even with</text>
  <text class="ts" x="928" y="508" text-anchor="middle">the office computer turned off</text>

  <rect class="box" x="786" y="528" width="284" height="132" rx="6"/>
  <text class="tb" x="928" y="552" text-anchor="middle">Option C: Hybrid Migration</text>
  <text class="ts" x="928" y="574" text-anchor="middle">• Mix simulated CPs, Office-driven</text>
  <text class="ts" x="928" y="592" text-anchor="middle">C/MRI &amp; LocoNet CPs, and standalone</text>
  <text class="ts" x="928" y="610" text-anchor="middle">ESP32 bungalows on one railroad.</text>
  <text class="ts" x="928" y="634" text-anchor="middle">• Local fascia panels always bind</text>
  <text class="ts" x="928" y="650" text-anchor="middle">at the Smart Appliance layer.</text>

  <text class="ts" x="786" y="692">Note: A mechanical interlocking tower</text>
  <text class="ts" x="786" y="710">with a physical locking bed is its own</text>
  <text class="ts" x="786" y="728">mechanical Vital Logic and needs no</text>
  <text class="ts" x="786" y="746">software or code line at all.</text>

  <!-- Dashed binding arrows -->
  <line class="dl" x1="764" y1="252" x2="730" y2="252"/>
  <line class="dl" x1="764" y1="516" x2="730" y2="516"/>
  <line class="dl" x1="764" y1="730" x2="720" y2="730"/>
</svg>
